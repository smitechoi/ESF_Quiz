<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객관식 퀴즈</title>

    <!-- ✅ 스타일 추가 -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h1, p {
            text-align: center;
        }
        #options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 250px;
            height: 150px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #007BFF;
            background-color: #f8f9fa;
            color: #007BFF;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .option-btn:hover {
            background-color: #007BFF;
            color: white;
        }
        .option-btn.selected {
            background-color: #0056b3;
            color: white;
            border-color: #004494;
        }
        #submitBtn {
            width: 300px;
            height: 100px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        #submitBtn:hover {
            background-color: #218838;
        }
    </style>
    <!-- ✅ PapaParse CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <h1 id="question">로딩 중...</h1>
    <p id="difficulty"></p> <!-- 난이도 표시 -->
    <div id="options"></div>
    <button id="submitBtn">제출</button>
    <div id="finishContainer"></div> <!-- ✅ 퀴즈 완료 버튼이 추가될 곳 -->

    <!-- ✅ Firebase 모듈 방식 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8SJjT_qbpw90ahkq-v36wO5sJTDh0qeM",
            authDomain: "esf-quiz.firebaseapp.com",
            projectId: "esf-quiz",
            storageBucket: "esf-quiz.firebasestorage.app",
            messagingSenderId: "974289794287",
            appId: "1:974289794287:web:c5c2e1c276d7536521971a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let quizData = [];
        let selectedQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestions = [];
        const totalQuestions = 15;
        const fourPointQuestions = 5;
        const twoPointQuestions = 10;

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        fetch("https://raw.githubusercontent.com/smitechoi/esf_quiz/main/quiz.csv")
            .then(response => response.text())
            .then(data => {
                quizData = Papa.parse(data, { header: true }).data;
                selectQuestions();
                loadQuestion();
            })
            .catch(error => console.error("CSV 로드 오류:", error));

        function selectQuestions() {
            let fourPointPool = quizData.filter(q => parseInt(q.Score) === 4);
            let twoPointPool = quizData.filter(q => parseInt(q.Score) === 2);
            let selectedFour = shuffleArray(fourPointPool).slice(0, fourPointQuestions);
            let selectedTwo = shuffleArray(twoPointPool).slice(0, twoPointQuestions);
            selectedQuestions = shuffleArray([...selectedFour, ...selectedTwo]);
        }

        function loadQuestion() {
            if (currentQuestionIndex >= selectedQuestions.length) {
                createFinishButton();
                return;
            }

            let currentQuestion = selectedQuestions[currentQuestionIndex];
            document.getElementById("question").innerText = currentQuestion.Question;
            document.getElementById("difficulty").innerText = `난이도: ${currentQuestion.Difficulty} | 점수: ${currentQuestion.Score}`;

            let options = currentQuestion.Options.split(",");
            let optionsHtml = options.map(option => `
                <button class="option-btn" onclick="selectOption(this)" data-value="${option}">${option}</button>
            `).join("");

            document.getElementById("options").innerHTML = optionsHtml;
        }

        function selectOption(button) {
            document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
            button.classList.add("selected");
        }

        function submitAnswer() {
            let selectedButton = document.querySelector(".option-btn.selected");
            if (!selectedButton) {
                alert("답변을 선택해주세요!");
                return;
            }

            let userAnswer = selectedButton.dataset.value;
            let currentQuestion = selectedQuestions[currentQuestionIndex];
            let isCorrect = userAnswer === currentQuestion.Answer;

            answeredQuestions.push({
                question: currentQuestion.Question,
                userAnswer: userAnswer,
                correctAnswer: currentQuestion.Answer,
                isCorrect: isCorrect,
                difficulty: currentQuestion.Difficulty,
                score: currentQuestion.Score
            });

            if (isCorrect) score += parseInt(currentQuestion.Score);
            currentQuestionIndex++;
            loadQuestion();
        }

        window.submitAnswer = submitAnswer;
        window.loadQuestion = loadQuestion;
        window.selectOption = selectOption;
        document.getElementById("submitBtn").addEventListener("click", submitAnswer);
    </script>
</body>
</html>
