<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 결과</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h2, p {
            text-align: center;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8SJjT_qbpw90ahkq-v36wO5sJTDh0qeM",
            authDomain: "esf-quiz.firebaseapp.com",
            projectId: "esf-quiz",
            storageBucket: "esf-quiz.firebasestorage.app",
            messagingSenderId: "974289794287",
            appId: "1:974289794287:web:c5c2e1c276d7536521971a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getQuizResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const resultId = urlParams.get("id");

            if (!resultId) {
                document.body.innerHTML = "<h2>결과를 찾을 수 없습니다.</h2>";
                return;
            }

            const docRef = doc(db, "quizResults", resultId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                let data = docSnap.data();
                document.body.innerHTML = `<h2>퀴즈 결과</h2>
                    <p>완료 시간: ${data.timestamp}</p>
                    <p>점수: ${data.score} / ${data.total}</p>`;
            } else {
                document.body.innerHTML = "<h2>결과를 찾을 수 없습니다.</h2>";
            }
        }

        getQuizResult();
    </script>
</head>
<body>
    <h2>결과를 불러오는 중...</h2>
</body>
</html>
