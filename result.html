<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 결과</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h2, p {
            text-align: center;
        }
        .button-container {
            display: flex;
            gap: 20px;
        }
        .menu-btn {
            width: 300px;
            height: 80px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: none;
        }
        .home-btn {
            background-color: #007BFF;
            color: white;
        }
        table {
            width: 90%;
            max-width: 800px;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            font-size: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #007BFF;
            color: white;
            text-align: center;
        }
        .correct {
            color: green;
            font-weight: bold;
            text-align: center;
        }
        .incorrect {
            color: red;
            font-weight: bold;
            text-align: center;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8SJjT_qbpw90ahkq-v36wO5sJTDh0qeM",
            authDomain: "esf-quiz.firebaseapp.com",
            projectId: "esf-quiz",
            storageBucket: "esf-quiz.firebasestorage.app",
            messagingSenderId: "974289794287",
            appId: "1:974289794287:web:c5c2e1c276d7536521971a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getQuizResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const resultId = urlParams.get("id");
            const lang = urlParams.get("lang") || "ko";

            if (!resultId) {
                document.body.innerHTML = "<h2>결과를 찾을 수 없습니다.</h2>";
                return;
            }

            const docRef = doc(db, "quizResults", resultId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                let data = docSnap.data();
                const isEn = lang === 'en';
                
                let detailsHtml = `
                    <table>
                        <tr>
                            <th>${isEn ? 'Question' : '문제'}</th>
                            <th>${isEn ? 'Your Answer' : '나의 답'}</th>
                            <th>${isEn ? 'Correct Answer' : '정답'}</th>
                            <th>${isEn ? 'Result' : '결과'}</th>
                        </tr>
                `;
                
                if (data.details && data.details.length > 0) {
                    data.details.forEach(item => {
                        let resultText = item.isCorrect ? "O" : "X";
                        let resultClass = item.isCorrect ? "correct" : "incorrect";
                        detailsHtml += `
                            <tr>
                                <td>${item.question}</td>
                                <td>${item.userAnswer}</td>
                                <td>${item.correctAnswer}</td>
                                <td class="${resultClass}">${resultText}</td>
                            </tr>
                        `;
                    });
                }
                detailsHtml += `</table>`;

                document.body.innerHTML = `<h1>${isEn ? 'Quiz Result' : '퀴즈 결과'}</h1>
                    <h3>${isEn ? 'Score' : '점수'}: ${data.score}</h3>
                    ${detailsHtml}
                    <button class="menu-btn home-btn" style="margin-top:20px; margin-bottom:50px;" onclick="location.href='index.html'">${isEn ? 'Return Home' : '홈으로 돌아가기'}</button>`;
            } else {
                document.body.innerHTML = "<h2>결과를 찾을 수 없습니다. (Result not found)</h2>";
            }
        }

        getQuizResult();
    </script>
</head>
<body>
    <h2>결과를 불러오는 중...</h2>
</body>
</html>
